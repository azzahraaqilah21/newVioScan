name: vioscan_flutter
description: VioScan BC-Care - AI-Assisted UV Fluorescence Screening App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Auth
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Bluetooth Classic SPP ke Raspberry Pi

  # UI
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # Formatting & localisation
  intl: ^0.19.0
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  pdf: ^3.13.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dependency_overrides:
  # Patch lokal: versi pub.dev memakai jcenter() & tanpa namespace → gagal
  # dibuild dengan Gradle 9 / AGP 9. Lihat third_party/flutter_bluetooth_serial.
  flutter_bluetooth_serial:
    path: third_party/flutter_bluetooth_serial

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
